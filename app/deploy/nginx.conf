# ===========================================================================
# Astrolabe · Nginx（入口：前端静态产物 + 反向代理）
#
# ⚠ 重要：前端是【Vite 构建产物】（app/frontend/dist），
#    ❌ 不是 Django 的 staticfiles —— 两者路径不同，别混
# ===========================================================================

# ★★★ 2026-10-23：**不再用 upstream 块**（原因见下）⚠
#   · · `upstream { server web:8000; }` 只在 **nginx 启动时解析一次**，
#     之后把 IP 缓存住 ⇒ web 容器重建（IP 变了）后 nginx 仍打旧地址
#     ⇒ 全站 502（* 所有者实测：搜 linux 返回 502）⚠
#   · · 改成「resolver + 变量式 proxy_pass」⇒ 每 10 秒重新解析 ✅
#   · · 127.0.0.11 = Docker 内置 DNS

resolver 127.0.0.11 valid=10s ipv6=off;

# ===========================================================================
# ★★★ 真实客户端 IP：**接入自有隧道后再打开**（2026-11-02 预留）⚠
#
# 现状：花生壳/端口映射**不传** X-Forwarded-For ⇒ nginx 只看到 Docker 网关
#       （172.19.0.1）⇒ ⛔ **现在不能开 realip**：
#       开了以后，客户端自己写的 XFF 会被当成真实 IP（比不开更容易被伪造）⚠
#
# 等自有隧道就位（它知道真实 peer IP），按这三步开启：
#   ① 隧道**覆盖**写：`X-Forwarded-For: <真实客户端IP>`
#      （⛔ 不要 append 客户端带来的值）
#   ② 打开下面这四行（把 172.16.0.0/12 换成隧道所在网段）
#   ③ 把下游转发头改成**覆盖**（见 server 里的 proxy_set_header 注释）
#   ④ 再把 80 端口从 0.0.0.0 改成 127.0.0.1（外网就只能经隧道进来）
#
# set_real_ip_from 172.16.0.0/12;   # docker 网桥（现在是 172.19.x）
# set_real_ip_from 127.0.0.1;       # 隧道在本机
# real_ip_header   X-Forwarded-For;
# real_ip_recursive on;             # 从右往左，取第一个不在白名单里的地址
# ===========================================================================

# ===========================================================================
# ★★★ 连接防护（2026-11-02）⚠
#
# ⚠★ **为什么阈值定得这么宽**：实测 `$remote_addr` 看到的是 **Docker 网关 IP**
#   （日志里是 `172.19.0.1`，不是真实客户端）—— 也就是说外面经花生壳/端口映射进来的
#   请求，在 nginx 眼里**可能全是同一个 IP**。
#   ⇒ 若按"每人 20 连接 / 10 rps"去限，**所有用户会被当成一个人** ⇒ 自己把站打死 ⚠
#   ⇒ 现在这套是**熔断级**：真实 IP 可见时它就是每 IP 的限制；
#     IP 塌成一个时，它仍然能把"疯了一样的单个来源"挡在门外 ✅
#
# ⚠ 真要收紧到"每人 N 个"，必须先让 nginx 拿到真实 IP（realip 模块 + 可信代理头），
#   而花生壳/家用路由通常**不传** `X-Forwarded-For` ⇒ 这条得等有 CDN / 反代再说
# ===========================================================================
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
limit_req_zone  $binary_remote_addr zone=perip_req:10m rate=100r/s;
limit_conn_status 429;
limit_req_status  429;

server {
    listen 80;

    # ★ 变量式 proxy_pass 才会走运行时解析（* 配合下方 resolver）⚠
    set $upstream_web "http://web:8000";

    # ⚠ 生产请改成真实域名；企业版填客户内网地址
    #    ★ 同时必须把它加进 deploy/.env 的 ALLOWED_HOSTS，否则 Django 会返回 400
    server_name _;

    # ★★★ 请求体上限：200m → **2m**（2026-11-02）⚠
    #   · 全站**没有文件上传接口**（`/api/me/upload` 返回的是"剩余额度"，不是收文件）
    #   · 200m 等于白送一个攻击面：一个人反复 POST 200MB ⇒ 占带宽 + 撑内存 ⚠
    #   · 将来真要做上传，**单独给那个 location 放开**，⛔ 不要恢复成全站默认
    client_max_body_size 2m;

    # ★★★ 慢连接防护（默认值都太宽容：header 60s / body 60s / keepalive 65s）⚠
    #   · Slowloris：一个连接慢慢发 header，靠默认 60 秒就能长期占住一个连接位
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    keepalive_timeout     30s;
    # 单 IP 并发连接上限（⚠ 见文件头的说明：IP 可能塌成一个 ⇒ 阈值取熔断级）
    limit_conn perip_conn 300;
    # 上游建连/发送超时（原来只有 read 有值）
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;

    # ===========================================================================
    # ★★ 转发头统一在 server 级设置 —— 对本 server 下【所有】location 生效
    #
    # ⚠ 踩过的坑：只在部分 location 里写 proxy_set_header，
    #   未写的那些会退化为 nginx 默认行为 —— 把 Host 设成 upstream 名（= "web"），
    #   于是 Django 的 ALLOWED_HOSTS 校验失败，返回 400 Bad Request。
    # ===========================================================================
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # ⚠★ 现在是**追加**（保留客户端带来的值）—— 因为还没接隧道，写进来的也不可信；
    #   等隧道就位、开了 realip 之后，这里要改成 `$remote_addr`（**覆盖**），
    #   否则客户端伪造的段会一路传到 Django ⚠
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 前端构建产物（Vite dist）+ SPA 兜底 ----
    # ★★★ 根路径 ⇒ **跳到 SPA 的挂载点**（★ 2026-10-13 补）⚠
    #
    # ⚠★★ 不跳会怎样：★ **白板**（★ 一个字都没有）⚠
    #
    # ```
    # ★ SPA 挂 /app/ 前缀（D26/D27），★ 而 react-router 的 basename 也是 /app ——
    #   ★★ 它取自 vite 的 `base`（见 frontend/src/main.tsx）
    # ⇒ ★★ 直接打开 `/` ⇒ ★ 路由的 basename 与路径对不上
    #   ⇒ ★ 一条路由都匹配不到 ⇒ ★ **渲染出空** ⚠
    #   ★ 而页面本身是 200、JS/CSS 也全是 200 ——
    #     ★★ 所以症状看起来像"服务器坏了"，★ 其实是路径差了一段 ⚠
    # ```
    #
    # ★ 302 而不是 301：★ 万一以后前缀要改，★ **不要让浏览器把旧路径记死** ⚠
    location = / {
        return 302 /app/;
    }

    # ---- ★★★ SPA 的静态产物（★ 2026-10-13 修了一个"永远白板"的 bug）----
    #
    # ⚠★★ 这里曾经是 `root /app/frontend; try_files $uri $uri/ /index.html;` ⚠
    #   ★ 而它**从第一天就是坏的** —— ★ 只是没人用浏览器打开过（★ 一直看的旧站）⚠
    #
    # ```
    # ★ 症状：★ 页面"能打开、但一个字都没有"（白板）
    # ★★ 线索：★ 访问日志里【每一个】资源都是 200，★ 而且**体积一模一样**（= index.html）⚠
    #    GET /app/assets/index-*.js   200  1038   ← ★★ 1038 是 index.html 的大小 ⚠
    #    GET /app/assets/index-*.css  200  1038
    #    GET /app/favicon.svg         200  1038
    #
    # ★★ 根因：`root` 是**前缀拼上去**的 ——
    #    root /app/frontend  +  请求 /app/assets/x.js
    #    ⇒ nginx 去找  /app/frontend/app/assets/x.js   ★★ ← 这个目录不存在 ⚠
    #    ⇒ try_files 兜底到 /index.html ⇒ ★ 把【一坨 HTML 当成 JS】发给浏览器 ⚠
    #    ⇒ ★★ 浏览器解析失败 ⇒ **整页什么都不渲染** ⚠
    # ```
    #
    # ★★ 修法：**让文件系统的结构与 URL 前缀对齐** ——
    #   · ★ 产物挂到 `/srv/www/app`（★ 见 `docker-compose.yml` 的 volumes）✅
    #   · ★ 于是 `root /srv/www` + 请求 `/app/assets/x.js` ⇒ `/srv/www/app/assets/x.js` ✅
    #   ⚠★ 别再改回 `/app/frontend` —— ★ 那会**原样复发** ⚠
    # ---- ★★★ 静态产物（★ 2026-10-13 再修一个"重建就崩"的坑）----
    #
    # ⚠★★ 静态资源**绝不能兜底到 `index.html`** ⚠ —— ★ 这是**必须单独写一个
    #   `location` 的理由**（★ 光靠下面那条 `location /` 的 `try_files` 会兜底）⚠
    #
    # ★★ 不单独写会怎样（★ 实测）：
    #   ```
    #   前端一重建 ⇒ 产物文件名变了（★ 内容哈希）⇒ 旧文件名【磁盘上没了】
    #   ★★ 而 `try_files … /app/index.html` 会让它返回 **HTML + 200** ⚠
    #     （★ 实测：/app/assets/index-ClvclOAp.js ⇒ HTTP 200，★ 内容却是 HTML）⚠
    #   ⇒ ★ 浏览器拿 HTML 当 ES module 执行 ⇒ **语法错误 ⇒ 整页崩** ⚠
    #   ⇒ ★★ 症状是"**点了没反应**" / 白板 —— ★ 而状态码全是 200 ⇒ **极难查** ⚠
    #   ```
    # ⇒ ★★ 所以：★ **找不到就是 404**（★ 让浏览器立刻暴露出来，❌ 不要静默地给 HTML）✅
    #
    # ★ 长缓存是安全的：★ 文件名带内容哈希 ⇒ 内容变则名字变 ✅
    location /app/assets/ {
        root /srv/www;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ⚠★★ 入口 HTML 必须**不缓存** ⚠
    #   ★ 否则重建后浏览器**一直要旧的文件名** ⇒ ★★ 撞上上面那个 404（或 200 的 HTML）⚠
    location = /app/index.html {
        root /srv/www;
        add_header Cache-Control "no-store" always;
    }
    location = /app/ {
        root /srv/www;
        add_header Cache-Control "no-store" always;
        try_files /app/index.html =404;
    }

    location / {
        root /srv/www;
        # ⚠★ 兜底也必须是 `/app/index.html`（★ 不是 `/index.html`）——
        #   ★ 否则 SPA 的客户端路由（如 `/app/workspace`）会落到一个**不存在的文件**上 ⚠
        #   ★ 它只对"客户端路由"生效 —— ★ 静态资源已被上面那条 `location` 接走 ✅
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /app/index.html;
    }

    # ---- Django 静态（admin 等）----
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # ★★★ 2026-10-24：**管理面在公网端口上一律 404** ⚠
    #   · · Django admin 与 /api/admin/* 只在 8090 端口提供（* 走 SSH 隧道）
    #   · · ⛔ 不要在这里放行：* 那是「太多重要设置和信息」的入口 ⚠
    location /admin/ {
        return 404;
    }
    location /api/admin/ {
        return 404;
    }

    # ---- API ----
    location /api/ {
        proxy_pass $upstream_web$request_uri;
        # ★ 解析相关的接口可能较慢（轮询作业进度），给足超时
        proxy_read_timeout 120s;
    }

    # ---- 健康检查（不写日志）----
    location = /healthz {
        proxy_pass $upstream_web$request_uri;
        access_log off;
    }

    # ★★ 就绪探针（DB / Redis / Meili，2026-10-24）⚠
    #   · · 只给**内网**用（容器网段 172.16/12 与 127.0.0.1），公网一律 404
    #   · · 公网用户不需要知道我们的依赖状态 ⚠
    location = /readyz {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass $upstream_web$request_uri;
        access_log off;
    }
}

# ============================================================================
# ★★★ 管理后台独立端口（8090 · 2026-10-24）⚠
# ============================================================================
# ⚠ 只由 `docker-compose.yml` 绑到 **127.0.0.1** ⇒ 公网与花生壳穿透都不可达
#   · · 访问方式：ssh -L 8090:127.0.0.1:8090 user@host  ⇒  浏览器开 http://127.0.0.1:8090/admin/
server {
    listen 8090;
    server_name _;

    # ⚠ 变量是**按 server 块**作用域的：80 那边定义的 `$upstream_web` 这里拿不到，
    #   * 必须在本块重新 set，否则 proxy_pass 为空 ⇒ nginx 直接 500 ⚠
    set $upstream_web "http://web:8000";

    # ★★★ 2026-10-24：**转发头必须在本块重新写一遍** ⚠
    #   · · 这四行写在 80 的 server 块里，**不会**作用到 8090
    #   · · 少了 `Host` ⇒ Django 收到的 Host 是 `web:8000`，
    #     而浏览器发来的 `Origin` 是 `http://127.0.0.1:8090`
    #     ⇒ Origin 与 Host 不一致 ⇒ **CSRF 校验失败（403）**（所有者实测）⚠
    # ⚠ 必须用 `$http_host`（**带端口**），⛔ 不能用 `$host`：
    #   · · `$host` 会去掉端口 ⇒ Django 的 get_host() = `127.0.0.1`
    #   · · 而浏览器 Origin 是 `http://127.0.0.1:8090`
    #   · · CSRF 校验比 Origin 与 Host，**端口不一致就算失败**（所有者实测 403）⚠
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    # ⚠★ 现在是**追加**（保留客户端带来的值）—— 因为还没接隧道，写进来的也不可信；
    #   等隧道就位、开了 realip 之后，这里要改成 `$remote_addr`（**覆盖**），
    #   否则客户端伪造的段会一路传到 Django ⚠
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 后台不做大上传
    client_max_body_size 8m;

    # ★ Django 静态（admin / unfold 的 CSS、JS）
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # ★ 根路径直接进后台
    location = / {
        return 302 /admin/;
    }

    # ★ 只有后台与它依赖的接口
    location /api/ {
        proxy_pass $upstream_web$request_uri;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass $upstream_web$request_uri;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass $upstream_web$request_uri;
        access_log off;
    }

    # ★★★ 临时：阅读页排版示意图（2026-10-26）⚠
    #   · · 所有者只能通过 SSH 隧道访问 8090，* 80 端口的站点他看不到 ⚠
    #   · · 所以把示意图单独挂到 8090 的一个**具体路径**上（* 不是开放整个站点）✅
    #   · ★ 看完就删掉这条 location ⚠
    location = /mockup-reading.html {
        alias /srv/www/app/mockup-reading.html;
        default_type text/html;
    }

    # ★ 写作页改版示意（* 看完一起删）⚠
    location = /mockup-edit.html {
        alias /srv/www/app/mockup-edit.html;
        default_type text/html;
    }

    # ⚠ 其余一律不开放（* 管理端口不做用户站）⚠
    location / {
        return 404;
    }
}
