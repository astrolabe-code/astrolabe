# ===========================================================================
# Astrolabe · Nginx（入口：前端静态产物 + 反向代理）
#
# ⚠ 重要：前端是【Vite 构建产物】（app/frontend/dist），
#    ❌ 不是 Django 的 staticfiles —— 两者路径不同，别混
# ===========================================================================

upstream astrolabe_web {
    server web:8000;
}

server {
    listen 80;

    # ⚠ 生产请改成真实域名；企业版填客户内网地址
    #    ★ 同时必须把它加进 deploy/.env 的 ALLOWED_HOSTS，否则 Django 会返回 400
    server_name _;

    # ★ 导入 .webapkg / 上传可能较大（WEBAPKG-SPEC.md）
    client_max_body_size 200m;

    # ===========================================================================
    # ★★ 转发头统一在 server 级设置 —— 对本 server 下【所有】location 生效
    #
    # ⚠ 踩过的坑：只在部分 location 里写 proxy_set_header，
    #   未写的那些会退化为 nginx 默认行为 —— 把 Host 设成 upstream 名（= "web"），
    #   于是 Django 的 ALLOWED_HOSTS 校验失败，返回 400 Bad Request。
    # ===========================================================================
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 前端构建产物（Vite dist）+ SPA 兜底 ----
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
    }

    # ---- Django 静态（admin 等）----
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://astrolabe_web;
        # ★ 解析相关的接口可能较慢（轮询作业进度），给足超时
        proxy_read_timeout 120s;
    }

    # ---- Django 管理后台 ----
    location /admin/ {
        proxy_pass http://astrolabe_web;
    }

    # ---- 健康检查（不写日志）----
    location = /healthz {
        proxy_pass http://astrolabe_web;
        access_log off;
    }
}
