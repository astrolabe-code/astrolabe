# ===========================================================================
# Astrolabe · ★ 公开版（部署到互联网，由我运营）
#
# 用法：
#   cd /home/ma/astrolabe/app/deploy
#   cp .env.example .env      # 首次：填好密码等
#   docker compose up -d --build
#
# ★ 版本切换（叠加覆盖文件）：
#   企业版： docker compose -f docker-compose.yml -f docker-compose.enterprise.yml up -d
#   开发：   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# ⚠ 详见 docs/DEPLOYMENT.md
# ===========================================================================

name: astrolabe

services:
  # ============================ 数据库 ============================
  db:
    # ★ postgres 的 entrypoint 需要 CHOWN / SETUID / SETGID / DAC_OVERRIDE 才能降权，
    #   ⛔ 不能丢 ALL；这里只去掉它用不到、被利用时最值钱的几项 ⚠
    cap_drop:
      - NET_RAW
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - MKNOD
      - SETFCAP
      - SETPCAP
      - AUDIT_WRITE
    image: postgres:17                    # ★ Debian 版
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - data
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data   # ★ named volume（不挂宿主机）
    ports:
      # ★★ 只绑 127.0.0.1 —— 供 Navicat 走 SSH 隧道（DEPLOYMENT.md D5）
      # ⚠ 严禁写成 "5432:5432"：那会绑到 0.0.0.0 ⇒ 数据库暴露公网，会被扫描爆破
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================ 队列 / 缓存 ============================
  #
  # ★★★ 用 **Valkey**，❌ 不用 `redis:7-alpine`（`B159`）
  #
  # ⚠★ 为什么换：★ Redis 自 **7.4 起改成 RSALv2 / SSPLv1 双许可**（★ 不再是开源）
  #   ⇒ 实测本机原先跑的就是 **`Redis server v=7.4.11`**（⚠ 正是那个版本）。
  #
  # ★★ SSPL 的触发条件是「**把该软件作为服务提供给第三方**」—— ★ 本平台**只是内部自用**
  #   （★ Redis 只给 Web 层与 Worker 用，❌ 不对外提供服务）⇒ ★ **实际并不触发**。
  #   ⚠★ 但**能从源头避免就避免** —— ★ 省得将来还要解释一遍。
  #
  # ★★★ Valkey = **Redis 7.2 的 BSD-3-Clause 分支**（★ 由 **Linux Foundation** 托管，
  #   ★ 由原 Redis 核心维护者主导）⇒ ★ **协议完全兼容、命令行工具一一对应**。
  #
  # ⚠★★ 两条**刻意保持不变**的东西（★ 改了会出问题）：
  #
  # | 保持 | 为什么 |
  # |---|---|
  # | ★★ **服务名仍叫 `redis`** | ⚠ 因为 `REDIS_URL=redis://redis:6379/0` **拿服务名当主机名** —— ★ 改名会**直接断开连接** |
  # | ★ Python 客户端仍是 `redis==5.2.1` | ★ 它是 **MIT**，★ 且 **Valkey 协议兼容** ⇒ ❌ 无需更换 |
  #
  # ⚠★ 另一处**刻意**的改动：★ 镜像 tag **钉到 minor 版本**（`8.0-alpine`，❌ 不是 `8-alpine`）——
  #   ★ 因为**这次问题的根因就是「tag 没钉住」**：`redis:7-alpine` 会滚到最新的 7.x，
  #   ★★ 于是**在无人察觉的情况下**从 BSD 滚到了 SSPL ⚠
  redis:
    # ★ 只需降权那几项（chown/setuid/setgid）；原始套接字、chroot、mknod 一律不要 ⚠
    cap_drop:
      - NET_RAW
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - MKNOD
      - SETFCAP
      - SETPCAP
      - AUDIT_WRITE
    image: valkey/valkey:8.0-alpine
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - data
    restart: unless-stopped
    # ★★★ 2026-11-03：**必须带密码**（原先 requirepass 为空 ⚠）
    #   为什么：9 个容器同在一个扁平网络 ⇒ 任何被攻破的容器都能直连 Redis；
    #   无密码时可读队列/审计、伪造作业，还能 `CONFIG SET dir` + `SAVE` 往容器里写文件
    #   ⚠ 密码从 .env 的 REDIS_PASSWORD 取（不进 git）
    #   ⚠ 顺手废掉几条"被攻破后最有用"的命令（CONFIG 改目录写文件、FLUSHALL 清数据）
    command: >
      valkey-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}
      --rename-command CONFIG ""
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
      --rename-command MONITOR ""
    environment:
      # ★ 只给健康检查用（valkey-cli 会读这个变量），不写进命令行
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      # ★ 带密码的健康检查（用 REDISCLI_AUTH，避免密码出现在 ps 里）
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDISCLI_AUTH\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ★ 不暴露端口 —— 队列/缓存不需要外部访问

  # ======================= 搜索引擎（Meilisearch）=======================
  #
  # ★★★ 2026-10-22（B238）：**搜索改走 Meilisearch**，不再往 Redis 结果缓存上打补丁
  #
  # ⚠★ 为什么是它、不是 ES：
  #   · ★ 单二进制 · 无 JVM · 无集群规划 · 内置 CJK 处理 · 内存约 100–200MB
  #   · ★★ ES 的运维成本是它的**十倍量级**（堆内存调优 / 分片 / 监控 / JVM 升级）
  #   · ★ **社区版 = 开源版**（MIT），⛔ 不用付费的企业版 / 云托管
  #
  # ⚠★★ **版本必须钉住**（v1.55.0，❌ 不是 latest）——
  #   本仓库已经因为「tag 没钉住」出过一次事故（Redis 7.x 静默滚到 SSPL）。
  #
  # ★★ 定位：**PostgreSQL 仍是唯一真相**，这里只是**可随时重建的索引**
  #   ⇒ 数据卷丢了不算事故，跑一次全量 reindex 即可 ✅
  meilisearch:
    # ★ 不需要任何 capability（不绑特权端口、不 chown、不 setuid）
    cap_drop:
      - ALL
    image: getmeili/meilisearch:v1.55.0
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - data
    restart: unless-stopped
    environment:
      # ⚠ 生产模式强制要求 master key（≥16 字节）
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY 未设置（见 .env）}
      MEILI_ENV: production
      # ★ 关闭匿名统计上报
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_DUMP_DIR: /meili_data/dumps
      MEILI_SNAPSHOT_DIR: /meili_data/snapshots
    volumes:
      - meilidata:/meili_data            # ○ 可重建（见上方说明）
    ports:
      # ★ 只绑 127.0.0.1 —— 本机 curl 调试用；⛔ 不暴露公网
      - "127.0.0.1:${MEILI_HOST_PORT:-17700}:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ============================ ① Web 层 ============================
  #
  # ★★ 镜像归属纪律（血泪教训，见 B132）：
  #   **只有 web 构建镜像**（它是唯一带 `build:` 的服务）；
  #   worker / heat 一律 `image:` 复用同一个镜像。
  #
  #   ⚠ 为什么：Compose 对「带 build 的服务」会生成 **每服务独立的镜像 tag**
  #     （`astrolabe-web` / `astrolabe-worker` / `astrolabe-heat`）。
  #     于是 `docker compose build web` **只更新 web 那一个** ——
  #     worker 会**静默地留在旧镜像上**，症状是「代码是新的、装的包是旧的」，
  #     ★ 极难排查（曾经表现为：解析器全部注册失败，却毫无报错）。
  #   ⇒ 统一成一个镜像后：**构建一次，三层同时生效**。
  web:
    image: astrolabe-web
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - edge
      - data
      - ops
    # ★★★ 2026-11-02：**不再以 root 运行**（所有者：「逃逸后，破坏力太大了」）⚠
    #   · 用 uid/gid = 1000：与宿主 ma 用户一致 ⇒ 挂载目录（data/uploads、
    #     data/repos、data/static）**不用改属主就能写** ✅
    #   · 端口 8000 > 1024 ⇒ 非 root 也能绑 ✅
    #   · 丢掉全部 capabilities + no-new-privileges：即使进程被控，也拿不到额外特权
    #   · PYTHONDONTWRITEBYTECODE：不往宿主机挂载目录里写 __pycache__
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    # ★★★ 2026-11-02：**UvicornWorker → gthread**（3 workers × 4 threads）⚠
    #   为什么换：
    #   · 本项目**没有异步视图**（全仓 0 个 `async def`），ASGI 白搭
    #   · ASGI 下同步视图走线程池，**线程数随并发涨** ⇒ 每个线程各占一条 PG 连接
    #     ⇒ 实测把 PostgreSQL 顶到 `too many clients already`（104/100）⇒ 部分请求 500 ⚠
    #   · gthread 的线程数是**固定的** ⇒ PG 连接数上限 = workers × threads = 12 ✅
    #   · 顺带把并发从 3 提到 12（原来同步视图在 ASGI 下是串行的）
    #   --max-requests：进程定期回收，防内存只增不减（长期运行的必要项）
    command: >
      gunicorn mysite.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3 --threads 4 --worker-class gthread
      --timeout 60 --graceful-timeout 25
      --max-requests 2000 --max-requests-jitter 200
    build:
      context: ..                         # app/
      dockerfile: deploy/Dockerfile
      target: public                      # ★ 公开版构建目标
    restart: unless-stopped
    env_file: [.env]
    # ★ 与 worker 同口径的内存上限（Web 进程本身不该吃这么多）
    mem_limit: 1g
    volumes:
      # ★ 源码挂出来 —— 可直接看 / 直接改（DEPLOYMENT.md D1）
      - /home/ma/astrolabe/app:/app:ro   # ★ 源码**只读**挂载：网站被攻破也改不了自己的代码
      - /home/ma/astrolabe/data/uploads:/app/data/uploads
      - /home/ma/astrolabe/data/static:/app/staticfiles
      # ★★★ 只读挂 Kuma 的数据卷（2026-10-24）⚠
      #   · · 后台「运维概览」要读监控状态；⛔ iframe 不行（X-Frame-Options: SAMEORIGIN）
      #   · · ⚠ 只读：Kuma 正在写这个库，我们绝不对它做任何写操作 ⚠
      - uptime_data:/kuma-data:ro
      # ★ 备份目录只读挂载 —— 后台「运维概览」显示最近备份（2026-10-24）⚠
      - /home/ma/backup:/backup:ro
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================ ② 作业层 ============================
  worker:
    image: astrolabe-web                  # ★ 复用 web 的镜像（见上方纪律）
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - edge
      - data
    restart: unless-stopped
    command: python manage.py run_worker
    # ★★★ 2026-11-02：**不再以 root 运行**（所有者：「逃逸后，破坏力太大了」）⚠
    #   · 用 uid/gid = 1000：与宿主 ma 用户一致 ⇒ 挂载目录（data/uploads、
    #     data/repos、data/static）**不用改属主就能写** ✅
    #   · 端口 8000 > 1024 ⇒ 非 root 也能绑 ✅
    #   · 丢掉全部 capabilities + no-new-privileges：即使进程被控，也拿不到额外特权
    #   · PYTHONDONTWRITEBYTECODE：不往宿主机挂载目录里写 __pycache__
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

    # ★★★ **内存硬上限**（2026-11-01）：解析是全量驻留内存的 ⚠
    #   实测：2MB C 文件 → 8.9 万节点 / 300MB；几千个文件就能把宿主机吃光。
    #   ⛔ 没有上限时 OOM 会打到宿主机，可能连带 db / nginx 一起挂（整站不可用）。
    #   ✅ 有上限时最坏结果是**这一个任务失败**，其它服务照常。
    mem_limit: 1500m
    pids_limit: 256
    env_file: [.env]
    volumes:
      - /home/ma/astrolabe/app:/app:ro   # ★ 源码**只读**挂载：网站被攻破也改不了自己的代码
      - /home/ma/astrolabe/data/repos:/app/data/repos   # ★ 拉取的源码：可直接看
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  # ============================ 搜索索引同步 ============================
  #
  # ★★ `B238`：笔记写库后 → Redis 队列 → **本进程**把变更推给 Meilisearch
  #
  # ⚠★ 为什么独立、不塞 web / 不塞 worker：
  #   · web 里同步做 ⇒ * 笔记保存被搜索引擎的延迟拖住（* 它挂了就卡写）⚠
  #   · 塞进 run_worker ⇒ * 解析任务一跑几分钟，* 索引跟着堵 ⚠
  #   · 独立 + `restart: unless-stopped` ⇒ * 崩了自动拉起 ✅
  searchsync:
    image: astrolabe-web                  # ★ 复用 web 的镜像（见上方纪律）
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - data
    restart: unless-stopped
    command: python manage.py search_worker
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    env_file: [.env]
    volumes:
      - /home/ma/astrolabe/app:/app:ro   # ★ 源码**只读**挂载：网站被攻破也改不了自己的代码
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    # ★★ 心跳健康检查（`B238`）：* 进程"活着但卡死"时 restart 不会触发，
    #   所以让它自己报心跳；* 超过 300 秒没更新 ⇒ unhealthy ⇒ 由部署侧重启 ⚠
    healthcheck:
      test: ["CMD-SHELL", "python manage.py search_worker --healthcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ============================ 自愈（健康检查失败自动重启）============================
  # ★★ 为什么要它（`B238` · 2026-10-23）：
  #   Docker 的 healthcheck 只**打标记**（unhealthy），
  #   `restart: unless-stopped` 只在**进程退出**时生效 ⇒ 进程"活着但卡死"没人管 ⚠
  #   这个容器监听所有带 healthcheck 的服务，变 unhealthy 就 docker restart 它 ✅
  # ===========================================================================
  # ★★★ 2026-11-02：**autoheal + socket-proxy 已全部移除** ⚠
  #
  # 原因（实测，不是猜测）：
  #   · `willfarrell/autoheal:1.2.0` 这个 tag 是**坏的**：镜像里没有 autoheal 二进制
  #     （`/usr/local/bin` 空）⇒ 起来就 exit 127、无限重启 —— 它其实一直没生效
  #   · 换成 `latest` + `tecnativa/docker-socket-proxy` 后看似能用，但深测发现：
  #       GET  /containers/json      → 200 ✅
  #       POST /containers/create    → **201 允许** ⚠  ← 能起特权容器 = 宿主 root
  #       POST /containers/<id>/exec → **201 允许** ⚠  ← 能进任意容器
  #       POST /images/create → 403 · /build → 403 · /secrets → 403 · /volumes → 403
  #     ⇒ 只要控制 autoheal，仍能 `create privileged + Binds /:/host` ⇒ **等于没防** ⚠
  #
  # 结论：**任何容器都不该拿到 docker API**（哪怕"只放行 restart"的代理也做不到干净）。
  #   健康检查自愈改到**宿主机侧**（systemd timer 跑脚本，容器里没有 socket）：
  #     deploy/healthwatch.sh + systemd/healthwatch.{service,timer}
  #   ⛔ 不要为了"自愈方便"再把 /var/run/docker.sock 挂进任何容器
  # ===========================================================================

  # ============================ 维护调度（热度合并）============================
  #
  # ★ 依据 GRAPH-STORAGE.md G5 / B129：Redis 里的热度是【热数据，重启会丢】
  #   ⇒ 必须定期合并进数据库（DB 才是权威累计值）。
  #
  # ⚠ 为什么是【独立常驻服务】而不是塞进 worker、也不是用 host cron：
  #   ① 部署在 Docker 里，没有 host cron 可依赖
  #   ② ★ 独立 ⇒ worker 卡在一个长解析上时，**热度仍能正常落库**
  #   ③ restart: unless-stopped ⇒ 崩了自动拉起，★ 不需要额外调度器
  heat:
    image: astrolabe-web                  # ★ 复用 web 的镜像（见上方纪律）
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - data
    restart: unless-stopped
    command: python manage.py heat_flush --loop --interval ${HEAT_INTERVAL:-900}
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    env_file: [.env]
    volumes:
      - /home/ma/astrolabe/app:/app:ro   # ★ 源码**只读**挂载：网站被攻破也改不了自己的代码
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  # ============================ 入口 ============================
  nginx:
    # ★ 不需要任何 capability（不绑特权端口、不 chown、不 setuid）
    cap_drop:
      - ALL
    # ★★★ 2026-11-02：**换成非 root 镜像**（所有者：「谁知道会不会有意想不到的漏洞」）⚠
    #   官方 nginx 的 master 必须 root（要绑 80 并写 /var/cache/nginx）；
    #   unprivileged 版以 uid 101 运行、监听 8080 ⇒ 即使被利用也拿不到 root ⚠
    # ★★★ 2026-11-02：1.27.5 → **1.30.6**（修 5 个 CVE，见 nginx.org 2026-10-14）⚠
    #   · CVE-2026-15176  alias + rewrite 缓冲区溢出
    #   · CVE-2026-93479  变量表达式求值时的缓冲区溢出
    #   · CVE-2026-95101  HTTP/3 请求体注入
    #   · CVE-2026-97205 / 97629  TLS 会话相关
    #   ⚠ 用**精确 patch 版本**（不是 stable-alpine）：stable 会随时间漂移，
    #     审计时说不清"当时到底是什么版本"
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - edge
      - ops
    restart: unless-stopped
    ports:
      # ⚠★ 2026-10-13：旧站退役 ⇒ 直接占 80（★ 花生壳穿透本来就指 80）
      - "${WEB_HTTP_PORT:-80}:8080"
      # ★★★ 2026-10-24：**管理后台独立端口**（所有者：「不要公开」「通过 SSH 隧道访问」）⚠
      #   · · 只绑 127.0.0.1 ⇒ 公网/穿透都摸不到，* 必须 SSH 隧道进来 ✅
      - "127.0.0.1:${ADMIN_HTTP_PORT:-8090}:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # ⚠★★ 前端产物在 **`/home/ma/astrolabe/frontend/dist`** ⚠ ——
      #   ★ `vite.config.ts` 的 `build.outDir` 就是它（★ 相对前端项目根）✅
      #   · ★ 以前这里写的是 `app/frontend/dist` —— ★ 那个目录**是空的** ⚠
      #     ⇒ ★★ nginx 找不到 `index.html` ⇒ **整个站点 403** ⚠
      #   · ★ 而 `docs/DEPLOYMENT.md` 里也写着那个旧路径 ⇒ ★ 已一并纠正 ✅
      # ⚠★★ 挂到 **`/srv/www/app`**（★ 不是 `/app/frontend`）⚠
      #   ★★ 为什么必须带那个 `app` 段：★ SPA 的 URL 前缀就是 `/app/`（`vite.config.ts` 的 `base`）⚠
      #   · ★ nginx 的 `root` 是**前缀拼上去**的 ⇒ ★ `root /srv/www` + 请求 `/app/assets/x.js`
      #     ⇒ ★ 正好落到 `/srv/www/app/assets/x.js` ✅
      #   · ★★ 以前挂在 `/app/frontend` ⇒ nginx 会去找 `/app/frontend/app/assets/x.js`
      #     ⇒ ★★ **不存在** ⇒ `try_files` 兜底成 index.html ⇒
      #       ★ 把 HTML 当 JS 发出去 ⇒ **整页白板** ⚠（★ 见 `nginx.conf` 里那段说明）
      - /home/ma/astrolabe/frontend/dist:/srv/www/app:ro
      - /home/ma/astrolabe/data/static:/app/staticfiles:ro
    depends_on:
      - web

  # ============================================================ 运维监控（2026-10-24）
  # ⚠ 全部**只绑 127.0.0.1** —— 所有者：「不要公开，这样不容易被攻陷，
  #   这里面有太多重要的设置和信息了」⇒ 一律 SSH 隧道访问 ⚠
  uptime-kuma:
    # ★ 不需要任何 capability（不绑特权端口、不 chown、不 setuid）
    cap_drop:
      - ALL
    # ★ MIT 许可（无 copyleft）；探活 + 告警 + 定时任务 Push 监控
    image: louislam/uptime-kuma:2
    # ★★★ 2026-11-03 网络分段（见文件末尾 networks: 的说明）⚠
    networks:
      - ops
      - data
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPTIME_PORT:-3001}:3001"
    volumes:
      - uptime_data:/app/data
    # ⚠ 不需要任何特权 / 不挂 docker.sock：* 只做 HTTP 探活 ⚠

volumes:
  uptime_data:

  pgdata:      # ★ PG 数据（不挂宿主机 —— 用 Navicat 查看，见 DEPLOYMENT.md D5）
  redisdata:   # ○ 可重建
  meilidata:   # ○ 可重建（★ 只是索引，丢了跑 reindex）


networks:
  # ★★★ 网络分段（2026-11-03）⚠
  #   原来 9 个容器全在一个扁平网络 ⇒ 攻破最外层的 nginx 就能直连 db / redis，
  #   而且所有人都能出网 ⇒ 被攻破后可外传数据
  #   edge  对外那一圈（可出网）· data  数据面（**internal ⇒ 不能出网**）· ops 运维面
  edge:
  data:
    # ⛔ db / redis / meili 只挂这个：连不出去，外传不了数据
    internal: true
  ops: