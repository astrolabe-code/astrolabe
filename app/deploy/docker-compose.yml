# ===========================================================================
# Astrolabe · ★ 公开版（部署到互联网，由我运营）
#
# 用法：
#   cd /home/ma/astrolabe/app/deploy
#   cp .env.example .env      # 首次：填好密码等
#   docker compose up -d --build
#
# ★ 版本切换（叠加覆盖文件）：
#   企业版： docker compose -f docker-compose.yml -f docker-compose.enterprise.yml up -d
#   开发：   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# ⚠ 详见 docs/DEPLOYMENT.md
# ===========================================================================

name: astrolabe

services:
  # ============================ 数据库 ============================
  db:
    image: postgres:17                    # ★ Debian 版
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data   # ★ named volume（不挂宿主机）
    ports:
      # ★★ 只绑 127.0.0.1 —— 供 Navicat 走 SSH 隧道（DEPLOYMENT.md D5）
      # ⚠ 严禁写成 "5432:5432"：那会绑到 0.0.0.0 ⇒ 数据库暴露公网，会被扫描爆破
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================ 队列 / 缓存 ============================
  #
  # ★★★ 用 **Valkey**，❌ 不用 `redis:7-alpine`（`B159`）
  #
  # ⚠★ 为什么换：★ Redis 自 **7.4 起改成 RSALv2 / SSPLv1 双许可**（★ 不再是开源）
  #   ⇒ 实测本机原先跑的就是 **`Redis server v=7.4.11`**（⚠ 正是那个版本）。
  #
  # ★★ SSPL 的触发条件是「**把该软件作为服务提供给第三方**」—— ★ 本平台**只是内部自用**
  #   （★ Redis 只给 Web 层与 Worker 用，❌ 不对外提供服务）⇒ ★ **实际并不触发**。
  #   ⚠★ 但**能从源头避免就避免** —— ★ 省得将来还要解释一遍。
  #
  # ★★★ Valkey = **Redis 7.2 的 BSD-3-Clause 分支**（★ 由 **Linux Foundation** 托管，
  #   ★ 由原 Redis 核心维护者主导）⇒ ★ **协议完全兼容、命令行工具一一对应**。
  #
  # ⚠★★ 两条**刻意保持不变**的东西（★ 改了会出问题）：
  #
  # | 保持 | 为什么 |
  # |---|---|
  # | ★★ **服务名仍叫 `redis`** | ⚠ 因为 `REDIS_URL=redis://redis:6379/0` **拿服务名当主机名** —— ★ 改名会**直接断开连接** |
  # | ★ Python 客户端仍是 `redis==5.2.1` | ★ 它是 **MIT**，★ 且 **Valkey 协议兼容** ⇒ ❌ 无需更换 |
  #
  # ⚠★ 另一处**刻意**的改动：★ 镜像 tag **钉到 minor 版本**（`8.0-alpine`，❌ 不是 `8-alpine`）——
  #   ★ 因为**这次问题的根因就是「tag 没钉住」**：`redis:7-alpine` 会滚到最新的 7.x，
  #   ★★ 于是**在无人察觉的情况下**从 BSD 滚到了 SSPL ⚠
  redis:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ★ 不暴露端口 —— 队列/缓存不需要外部访问

  # ======================= 搜索引擎（Meilisearch）=======================
  #
  # ★★★ 2026-10-22（B238）：**搜索改走 Meilisearch**，不再往 Redis 结果缓存上打补丁
  #
  # ⚠★ 为什么是它、不是 ES：
  #   · ★ 单二进制 · 无 JVM · 无集群规划 · 内置 CJK 处理 · 内存约 100–200MB
  #   · ★★ ES 的运维成本是它的**十倍量级**（堆内存调优 / 分片 / 监控 / JVM 升级）
  #   · ★ **社区版 = 开源版**（MIT），⛔ 不用付费的企业版 / 云托管
  #
  # ⚠★★ **版本必须钉住**（v1.55.0，❌ 不是 latest）——
  #   本仓库已经因为「tag 没钉住」出过一次事故（Redis 7.x 静默滚到 SSPL）。
  #
  # ★★ 定位：**PostgreSQL 仍是唯一真相**，这里只是**可随时重建的索引**
  #   ⇒ 数据卷丢了不算事故，跑一次全量 reindex 即可 ✅
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    restart: unless-stopped
    environment:
      # ⚠ 生产模式强制要求 master key（≥16 字节）
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY 未设置（见 .env）}
      MEILI_ENV: production
      # ★ 关闭匿名统计上报
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_DUMP_DIR: /meili_data/dumps
      MEILI_SNAPSHOT_DIR: /meili_data/snapshots
    volumes:
      - meilidata:/meili_data            # ○ 可重建（见上方说明）
    ports:
      # ★ 只绑 127.0.0.1 —— 本机 curl 调试用；⛔ 不暴露公网
      - "127.0.0.1:${MEILI_HOST_PORT:-17700}:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ============================ ① Web 层 ============================
  #
  # ★★ 镜像归属纪律（血泪教训，见 B132）：
  #   **只有 web 构建镜像**（它是唯一带 `build:` 的服务）；
  #   worker / heat 一律 `image:` 复用同一个镜像。
  #
  #   ⚠ 为什么：Compose 对「带 build 的服务」会生成 **每服务独立的镜像 tag**
  #     （`astrolabe-web` / `astrolabe-worker` / `astrolabe-heat`）。
  #     于是 `docker compose build web` **只更新 web 那一个** ——
  #     worker 会**静默地留在旧镜像上**，症状是「代码是新的、装的包是旧的」，
  #     ★ 极难排查（曾经表现为：解析器全部注册失败，却毫无报错）。
  #   ⇒ 统一成一个镜像后：**构建一次，三层同时生效**。
  web:
    image: astrolabe-web
    build:
      context: ..                         # app/
      dockerfile: deploy/Dockerfile
      target: public                      # ★ 公开版构建目标
    restart: unless-stopped
    env_file: [.env]
    volumes:
      # ★ 源码挂出来 —— 可直接看 / 直接改（DEPLOYMENT.md D1）
      - /home/ma/astrolabe/app:/app
      - /home/ma/astrolabe/data/uploads:/app/data/uploads
      - /home/ma/astrolabe/data/static:/app/staticfiles
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================ ② 作业层 ============================
  worker:
    image: astrolabe-web                  # ★ 复用 web 的镜像（见上方纪律）
    restart: unless-stopped
    command: python manage.py run_worker
    env_file: [.env]
    volumes:
      - /home/ma/astrolabe/app:/app
      - /home/ma/astrolabe/data/repos:/app/data/repos   # ★ 拉取的源码：可直接看
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  # ============================ 搜索索引同步 ============================
  #
  # ★★ `B238`：笔记写库后 → Redis 队列 → **本进程**把变更推给 Meilisearch
  #
  # ⚠★ 为什么独立、不塞 web / 不塞 worker：
  #   · web 里同步做 ⇒ * 笔记保存被搜索引擎的延迟拖住（* 它挂了就卡写）⚠
  #   · 塞进 run_worker ⇒ * 解析任务一跑几分钟，* 索引跟着堵 ⚠
  #   · 独立 + `restart: unless-stopped` ⇒ * 崩了自动拉起 ✅
  searchsync:
    image: astrolabe-web                  # ★ 复用 web 的镜像（见上方纪律）
    restart: unless-stopped
    command: python manage.py search_worker
    env_file: [.env]
    volumes:
      - /home/ma/astrolabe/app:/app
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    # ★★ 心跳健康检查（`B238`）：* 进程"活着但卡死"时 restart 不会触发，
    #   所以让它自己报心跳；* 超过 300 秒没更新 ⇒ unhealthy ⇒ 由部署侧重启 ⚠
    healthcheck:
      test: ["CMD-SHELL", "python manage.py search_worker --healthcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ============================ 自愈（健康检查失败自动重启）============================
  # ★★ 为什么要它（`B238` · 2026-10-23）：
  #   Docker 的 healthcheck 只**打标记**（unhealthy），
  #   `restart: unless-stopped` 只在**进程退出**时生效 ⇒ 进程"活着但卡死"没人管 ⚠
  #   这个容器监听所有带 healthcheck 的服务，变 unhealthy 就 docker restart 它 ✅
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      # ⚠ 挂 docker.sock = 给它本机 root 级控制权；* 单机自建可接受，
      #   多租户/公有云请换成只读的 docker API 代理 ⚠
      - /var/run/docker.sock:/var/run/docker.sock

  # ============================ 维护调度（热度合并）============================
  #
  # ★ 依据 GRAPH-STORAGE.md G5 / B129：Redis 里的热度是【热数据，重启会丢】
  #   ⇒ 必须定期合并进数据库（DB 才是权威累计值）。
  #
  # ⚠ 为什么是【独立常驻服务】而不是塞进 worker、也不是用 host cron：
  #   ① 部署在 Docker 里，没有 host cron 可依赖
  #   ② ★ 独立 ⇒ worker 卡在一个长解析上时，**热度仍能正常落库**
  #   ③ restart: unless-stopped ⇒ 崩了自动拉起，★ 不需要额外调度器
  heat:
    image: astrolabe-web                  # ★ 复用 web 的镜像（见上方纪律）
    restart: unless-stopped
    command: python manage.py heat_flush --loop --interval ${HEAT_INTERVAL:-900}
    env_file: [.env]
    volumes:
      - /home/ma/astrolabe/app:/app
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  # ============================ 入口 ============================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # ⚠★ 2026-10-13：旧站退役 ⇒ 直接占 80（★ 花生壳穿透本来就指 80）
      - "${WEB_HTTP_PORT:-80}:80"
      # ★★★ 2026-10-24：**管理后台独立端口**（所有者：「不要公开」「通过 SSH 隧道访问」）⚠
      #   · · 只绑 127.0.0.1 ⇒ 公网/穿透都摸不到，* 必须 SSH 隧道进来 ✅
      - "127.0.0.1:${ADMIN_HTTP_PORT:-8090}:8090"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # ⚠★★ 前端产物在 **`/home/ma/astrolabe/frontend/dist`** ⚠ ——
      #   ★ `vite.config.ts` 的 `build.outDir` 就是它（★ 相对前端项目根）✅
      #   · ★ 以前这里写的是 `app/frontend/dist` —— ★ 那个目录**是空的** ⚠
      #     ⇒ ★★ nginx 找不到 `index.html` ⇒ **整个站点 403** ⚠
      #   · ★ 而 `docs/DEPLOYMENT.md` 里也写着那个旧路径 ⇒ ★ 已一并纠正 ✅
      # ⚠★★ 挂到 **`/srv/www/app`**（★ 不是 `/app/frontend`）⚠
      #   ★★ 为什么必须带那个 `app` 段：★ SPA 的 URL 前缀就是 `/app/`（`vite.config.ts` 的 `base`）⚠
      #   · ★ nginx 的 `root` 是**前缀拼上去**的 ⇒ ★ `root /srv/www` + 请求 `/app/assets/x.js`
      #     ⇒ ★ 正好落到 `/srv/www/app/assets/x.js` ✅
      #   · ★★ 以前挂在 `/app/frontend` ⇒ nginx 会去找 `/app/frontend/app/assets/x.js`
      #     ⇒ ★★ **不存在** ⇒ `try_files` 兜底成 index.html ⇒
      #       ★ 把 HTML 当 JS 发出去 ⇒ **整页白板** ⚠（★ 见 `nginx.conf` 里那段说明）
      - /home/ma/astrolabe/frontend/dist:/srv/www/app:ro
      - /home/ma/astrolabe/data/static:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  pgdata:      # ★ PG 数据（不挂宿主机 —— 用 Navicat 查看，见 DEPLOYMENT.md D5）
  redisdata:   # ○ 可重建
  meilidata:   # ○ 可重建（★ 只是索引，丢了跑 reindex）
